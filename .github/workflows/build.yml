name: Compilar Plugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HitomicDraw

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: HitomicDraw/pom.xml

      - name: Compilar JAR
        run: mvn -B clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: HitomicDraw-JAR
          path: HitomicDraw/target/*.jar
