    - "&8Solte no chao para destruir"

  # --- avaliacao
  review-map-name: "&e&lParticipacao #{id}"
  review-map-lore:
    - "&7Jogador: &f{player}"
    - "&7Enviado em: &f{date}"
    - "&7Status: {status}"
    - "&7Avaliado por: &f{reviewer} &7em &f{reviewed}"
    - "&7Motivo: &f{note}"
    - "&8Clique no mapa para receber uma copia e ver em tamanho real"
  status-pending: "&ependente"
  status-approved: "&aaprovado"
  status-rejected: "&crejeitado"
  list-header: "&6Avaliacoes &8(&e{pending} pendentes&8, &a{approved} aprovadas&8, &c{rejected} rejeitadas&8) &7filtro: &f{filter}"
