  item-lore-draft:
    - "&7Autor: &f{player}"
    - "&7Estado: &fem edicao"
    - "&8Use /desenhar abrir para editar"
  item-lore-finished:
    - "&7Autor: &f{player}"
    - "&7Estado: &afinalizado"
    - "&8Solte (Q) no chao para enviar"
  item-lore-submitted:
