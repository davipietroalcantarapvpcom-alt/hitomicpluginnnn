  view-copy-given: "&7Voce recebeu uma copia de visualizacao. Solte-a no chao quando terminar."
  console-view: "Participacao #{id} | jogador: {player} | enviada em: {date} | status: {status}"

  # --- resultado enviado ao jogador
  result-approved: "&aSeu desenho foi &lAPROVADO&a! &7(participacao #{id}, avaliado por {reviewer})"
  result-rejected: "&cSeu desenho foi &lREJEITADO&c. &7(participacao #{id}, avaliado por {reviewer})"
  result-note: "&7Motivo: &f{note}"
  title-approved: "&a&lAprovado!"
